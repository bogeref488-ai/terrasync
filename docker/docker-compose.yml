services:
  postgres:
    image: postgres:16
    container_name: terrasync_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: terrasync
    ports:
      - "5432:5432"
    volumes:
      - terrasync_pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: terrasync_redis
    ports:
      - "6379:6379"

volumes:
  terrasync_pg_data:
